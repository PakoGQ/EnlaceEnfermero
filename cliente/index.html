<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — Enlace Enfermero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D6EFD">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/panel.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="panel">

  <header id="panelCabecera"></header>
  <aside id="panelNav"></aside>

  <main class="panel-contenido">

    <div class="panel-encabezado">
      <div>
        <h1 id="saludo">Inicio</h1>
        <p>Tus servicios activos y el personal asignado.</p>
      </div>
      <div class="panel-acciones">
        <a href="solicitar.html" class="btn btn-primario">Solicitar personal</a>
      </div>
    </div>

    <section class="kpis" id="kpis" aria-label="Resumen de tus servicios">
      <div class="tarjeta kpis-ancho-total"><div class="spinner"></div></div>
    </section>

    <section class="bloque-panel" aria-labelledby="tituloAlertas">
      <h2 id="tituloAlertas" class="titulo-bloque">Requiere tu atención</h2>
      <div class="lista-alertas" id="alertas"></div>
    </section>

    <div class="panel-columnas">
      <section class="tarjeta" aria-labelledby="tituloProximos">
        <div class="tarjeta-cabecera">
          <div>
            <h3 id="tituloProximos">Próximos turnos</h3>
            <p class="texto-sm txt-secundario">Quién llega y cuándo.</p>
          </div>
        </div>
        <div id="proximosTurnos"><div class="spinner"></div></div>
      </section>

      <section class="tarjeta" aria-labelledby="tituloAtajos">
        <div class="tarjeta-cabecera"><h3 id="tituloAtajos">Atajos</h3></div>
        <div class="atajos">
          <a href="solicitar.html" class="atajo">
            <span class="atajo-icono" data-icono="inbox"></span>
            <div><strong>Solicitar personal</strong><span>Nueva solicitud</span></div>
          </a>
          <a href="solicitudes.html" class="atajo">
            <span class="atajo-icono" data-icono="documento"></span>
            <div><strong>Mis solicitudes</strong><span>Seguimiento</span></div>
          </a>
          <a href="personal.html" class="atajo">
            <span class="atajo-icono" data-icono="usuarios"></span>
            <div><strong>Personal</strong><span>Quién ha trabajado contigo</span></div>
          </a>
          <a href="evaluar.html" class="atajo">
            <span class="atajo-icono" data-icono="estrella"></span>
            <div><strong>Evaluar</strong><span>Califica un servicio</span></div>
          </a>
        </div>
      </section>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/panel.js"></script>
  <script src="../js/admin-comun.js"></script>
  <script src="../js/cliente-comun.js"></script>
  <script src="../js/cliente-inicio.js"></script>
  <script>
    iniciarPanel(['cliente'], 'index.html').then(perfil => {
      if (!perfil) return;
      iniciarInicioCliente();
    });
  </script>

</body>
</html>
