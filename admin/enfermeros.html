<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal — Enlace Enfermero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D6EFD">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/panel.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="panel">

  <header id="panelCabecera"></header>
  <aside id="panelNav"></aside>

  <main class="panel-contenido">

    <div class="panel-encabezado">
      <div>
        <h1>Cartera de personal</h1>
        <p>Alta, edición y publicación de perfiles. Nadie llega al catálogo sin expediente completo.</p>
      </div>
      <div class="panel-acciones"><button type="button" class="btn btn-secundario" id="btnExportar">Exportar CSV</button>
        <button type="button" class="btn btn-primario" id="btnNuevo">Dar de alta</button></div>
    </div>

    <div class="barra-herramientas">
      <div id="filtros"></div>
      <div class="campo-busqueda campo-busqueda-panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="buscar" class="entrada" placeholder="Buscar por nombre o folio">
      </div>
    </div>

    <div class="resumen-barra" id="resumen"></div>

    <div id="tabla"><div class="spinner"></div></div>

  </main>

  <div class="velo-detalle" id="veloDetalle"></div>
  <aside class="panel-detalle" id="panelDetalle" aria-label="Detalle"></aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/panel.js"></script>
  <script src="../js/admin-comun.js"></script>
  <script src="../js/admin-enfermeros.js"></script>
  <script>
    iniciarPanel(['admin', 'coordinador'], 'enfermeros.html').then(perfil => {
      if (perfil) iniciarEnfermeros(perfil);
    });
  </script>

</body>
</html>
