<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitudes — Enlace Enfermero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D6EFD">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/panel.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="panel">

  <header id="panelCabecera"></header>
  <aside id="panelNav"></aside>

  <main class="panel-contenido panel-ancho">

    <div class="panel-encabezado">
      <div>
        <h1>Solicitudes</h1>
        <p>Arrastra una tarjeta para cambiarla de columna, o ábrela para cotizar y proponer personal.</p>
      </div>
      <div class="panel-acciones">
        <button type="button" class="btn btn-secundario" id="btnRecargar">Actualizar</button>
      </div>
    </div>

    <div class="tablero" id="tablero"><div class="spinner"></div></div>

  </main>

  <!-- Panel lateral de detalle -->
  <div class="velo-detalle" id="veloDetalle"></div>
  <aside class="panel-detalle" id="panelDetalle" aria-label="Detalle de la solicitud"></aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/panel.js"></script>
  <script src="../js/panel-admin.js"></script>
  <script src="../js/admin-solicitudes.js"></script>
  <script>
    iniciarPanel(['admin', 'coordinador'], 'solicitudes.html').then(perfil => {
      if (!perfil) return;
      iniciarSolicitudesAdmin();
      document.getElementById('btnRecargar').addEventListener('click', cargarTablero);
    });
  </script>

</body>
</html>
