<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disponibilidad — Enlace Enfermero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D6EFD">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/panel.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="panel">

  <header id="panelCabecera"></header>
  <aside id="panelNav"></aside>

  <main class="panel-contenido">

    <div class="panel-encabezado">
      <div>
        <h1>Mi disponibilidad</h1>
        <p>Marca los turnos que puedes cubrir. Es lo que usamos para proponerte trabajo.</p>
      </div>
      <div class="panel-acciones">
        <button type="button" class="btn btn-primario" id="btnPlantilla">Aplicar plantilla semanal</button>
      </div>
    </div>

    <section class="tarjeta bloque-panel" aria-labelledby="tituloMes">
      <div class="tarjeta-cabecera">
        <button type="button" class="btn-icono" id="mesAnterior" aria-label="Mes anterior">&#8249;</button>
        <h2 id="tituloMes" class="titulo-bloque"></h2>
        <button type="button" class="btn-icono" id="mesSiguiente" aria-label="Mes siguiente">&#8250;</button>
      </div>
      <div id="calendario"><div class="spinner"></div></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/panel.js"></script>
  <script src="../js/admin-comun.js"></script>
  <script src="../js/enfermero-comun.js"></script>
  <script src="../js/enfermero-disponibilidad.js"></script>
  <script>
    iniciarPanel(['enfermero'], 'disponibilidad.html').then(perfil => {
      if (!perfil) return;
      iniciarDisponibilidad();
    });
  </script>

</body>
</html>
