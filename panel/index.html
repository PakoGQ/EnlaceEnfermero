<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi panel — Enlace Enfermero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D6EFD">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/panel.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="panel">

  <header id="panelCabecera"></header>
  <aside id="panelNav"></aside>

  <main class="panel-contenido">
    <div class="panel-encabezado">
      <div>
        <h1 id="saludo">Inicio</h1>
        <p>Tus próximos turnos y el estado de tu perfil.</p>
      </div>
    </div>

    <div class="tarjeta">
      <h2>En construcción</h2>
      <p class="txt-secundario">Aquí van tus próximos turnos, tus ganancias del mes y
         las alertas de documentos por vencer.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/panel.js"></script>
  <script>
    iniciarPanel(['enfermero'], 'index.html').then(perfil => {
      if (!perfil) return;
      document.getElementById('saludo').textContent =
        '¡Hola, ' + perfil.nombre + '!';
    });
  </script>

</body>
</html>
